name: Reproducibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Check dependency consistency
        run: uv pip check
      - name: Verify project evidence
        run: |
          uv run --locked python scripts/verify.py
          uv run --locked python -m pytest -q
